<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef08a" />
      <stop offset="30%" style="stop-color:#f59e0b" />
      <stop offset="70%" style="stop-color:#d97706" />
      <stop offset="100%" style="stop-color:#78350f" />
    </linearGradient>

    <!-- Glassmorphism Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Inner Subtle Glass Border -->
  <rect x="18" y="18" width="476" height="476" rx="102" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>

  <!-- Light Ambient Glow behind Text -->
  <circle cx="256" cy="240" r="120" fill="#38bdf8" opacity="0.18" filter="url(#glow)"/>

  <!-- Main Pali Symbol "ฐฺ" -->
  <g filter="url(#shadow)">
    <text x="256" y="275"
          font-family="'Sarabun', 'TH Sarabun New', 'Kinnari', 'Segoe UI', sans-serif"
          font-size="280"
          font-weight="bold"
          fill="url(#goldGrad)"
          text-anchor="middle"
          dominant-baseline="middle">ฐฺ</text>
  </g>

  <!-- Repair Sparkles (สัญลักษณ์การซ่อม/กู้อักขระ) -->
  <!-- Sparkle 1 (Top Right - Gold) -->
  <path d="M 385 115 Q 385 140 410 140 Q 385 140 385 165 Q 385 140 360 140 Q 385 140 385 115 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <!-- Sparkle 2 (Bottom Left - Cyan Glow) -->
  <path d="M 130 355 Q 130 370 145 370 Q 130 370 130 385 Q 130 370 115 370 Q 130 370 130 355 Z" fill="#38bdf8" opacity="0.85"/>
  <!-- Sparkle 3 (Top Left - Small White) -->
  <path d="M 140 130 Q 140 140 150 140 Q 140 140 140 150 Q 140 140 130 140 Q 140 140 140 130 Z" fill="#ffffff" opacity="0.6"/>
</svg>
